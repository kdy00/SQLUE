name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# The workflow only reads the repository. It needs no secrets or tokens.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Keep running the other version when one fails,
      # so both results are visible on the pull request.
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.15"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install -r requirements-dev.txt

      # Only the logic and case data are tested. The runner has no display,
      # and the tests do not import the Tkinter UI package.
      - name: Run tests
        run: python -m pytest -v
